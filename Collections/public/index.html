
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Football Teams</title>
    <link rel="stylesheet" href="./css/site.css">
</head>
<body>
    <h1>College Football Teams</h1>
    <p>Manage your college football team collection.</p>

    <h2>Add a Team</h2>

    <form id="add-form">
        <label for="add-name">Team Name:</label>
        <input type="text" id="add-name" required>

        <label for="add-conference">Conference:</label>
        <select id="add-conference" required>
            <option value="" disabled selected hidden>Select a conference</option>            <option value="Big Ten">Big Ten</option>
            <option value="SEC">SEC</option>
            <option value="Pac-12">Pac-12</option>
            <option value="ACC">ACC</option>
            <option value="Big 12">Big 12</option>
            <option value="Mountain West">Mountain West</option>
            <option value="American Athletic">American Athletic</option>
            <option value="Sun Belt">Sun Belt</option>
            <option value="Conference USA">Conference USA</option>
            <option value="MAC">MAC</option>
            <option value="FBS Independent">FBS Independent</option>
        </select>

        <label for="add-wins">Wins:</label>
        <input type="number" id="add-wins" min="0" required>

        <button type="submit">Add Team</button>
    </form>

    <p id="message" role="status"></p>

    <h2>Team Collection</h2>
    <p id="counter">Loading teams...</p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Team</th>
                <th>Conference</th>
                <th>Wins</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="teams"></tbody>
    </table>

    <section id="team-details" hidden>
        <h2>Team Details</h2>
        <p id="details-text"></p>
        <button type="button" id="close-details">Close Details</button>
    </section>

    <section id="edit-form" hidden>
        <h2>Edit Team</h2>

        <form id="update-form">
            <input type="hidden" id="edit-id">

            <label for="edit-name">Team Name:</label>
            <input type="text" id="edit-name" required>

            <label for="edit-conference">Conference:</label>
            <select id="edit-conference" required>
                <option value="" disabled selected hidden>Select a conference</option>
                <option value="Big Ten">Big Ten</option>
                <option value="SEC">SEC</option>
                <option value="Pac-12">Pac-12</option>
                <option value="ACC">ACC</option>
                <option value="Big 12">Big 12</option>
                <option value="Mountain West">Mountain West</option>
                <option value="American Athletic">American Athletic</option>
                <option value="Sun Belt">Sun Belt</option>
                <option value="Conference USA">Conference USA</option>
                <option value="MAC">MAC</option>
                <option value="FBS Independent">FBS Independent</option>
            </select>

            <label for="edit-wins">Wins:</label>
            <input type="number" id="edit-wins" min="0" required>

            <button type="submit">Save Changes</button>
            <button type="button" id="cancel-edit">Cancel</button>
        </form>
    </section>

    <script src="./js/site.js"></script>
</body>
</html>
