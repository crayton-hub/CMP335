<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 3 Exercise - Javascript Sampling</title>

    <link rel="stylesheet" href="exercise.css">
    <script src="exercise.js"></script>
</head>
<body>
    <h1>Mean, Median, Mode Calculator</h1>
    <div class="myflexboxRow">
        <div class="myflexboxColumn">
            <h2>Form to calcualte mean, median, and mode based off input</h2>
            <form name="myForm">
                Range low: <input type="number" name="low" ><br />
                Range high: <input type="number" name="high" ><br /><br />

                New number: <input type="number" name="newNum" value=""><br />
                <input type="button" value="Add number" onclick="validateANDadd()"><br /><br />
            </form>
        </div>
        <div class="myflexboxColumn">
            <h2>Numbers</h2>
            <table id="myList1">
            </table>
            <br /> <br />
            <input type="button" value="Clear the list" onclick="clearList1()">
        </div>
        <div class="myflexboxColumn">
            <h2>Results</h2>
            Mean: <span id="mean"></span><br />
            Median: <span id="median"></span><br />
            Mode: <span id="mode"></span><br />

        </div>
    </div>    
</body>
</html>
