<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Palindrome Checker</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- My CSS -->
    <link rel="stylesheet" href="pala.css">
</head>

<body>

    <div class="container py-4">

        <h1>Palindrome Checker</h1>

        <div class="row g-4">

            <!--form section-->
            <div class="col-md-3">
                <div class="section-box">
                    <h2>Check a Word</h2>
                    <label for="word">Word to check:</label>
                    <input type="text" id="word" class="form-control">

                    <label for="algorithm" class="mt-3">
                        Algorithm to use:
                    </label>

                    <select id="algorithm" class="form-select">
                        <option value="1">Algorithm 1</option>
                        <option value="2">Algorithm 2</option>
                        <option value="3">Algorithm 3</option>
                    </select>

                    <label for="caseOption" class="mt-3">
                        Case sensitivity:
                    </label>

                    <select id="caseOption" class="form-select">
                        <option value="sensitive">Case Sensitive</option>
                        <option value="insensitive">Case Insensitive</option>
                    </select>

                    <button
                        onclick="checkWord()"
                        class="btn btn-primary rounded-pill px-3">
                        Check and add to list
                    </button>

                </div>
            </div>

            <!-- ALGORITHM 1 -->
            <div class="col-md-3">
                <div class="section-box">
                    <h2>Algorithm 1</h2>
                    <h3>Outside → Inside</h3>
                    <div id="algorithm1List">

                    </div>

                    <button
                        onclick="clearList(1)"
                        class="btn btn-outline-secondary">
                        Clear the list
                    </button>

                </div>
            </div>

            <!-- ALGORITHM 2 -->
            <div class="col-md-3">
                <div class="section-box">

                    <h2>Algorithm 2</h2>
                    <h3>Reverse → Compare</h3>

                    <div id="algorithm2List">

                    </div>

                    <button
                        onclick="clearList(2)"
                        class="btn btn-outline-secondary">
                        Clear the list
                    </button>

                </div>
            </div>

            <!-- ALGORITHM 3 -->
            <div class="col-md-3">
                <div class="section-box">

                    <h2>Algorithm 3</h2>
                    <h3>Middle → Outside</h3>

                    <div id="algorithm3List">

                    </div>

                    <button
                        onclick="clearList(3)"
                        class="btn btn-outline-secondary">
                        Clear the list
                    </button>

                </div>
            </div>

        </div>

    </div>

    <script src="pala.js"></script>

</body>
</html>
